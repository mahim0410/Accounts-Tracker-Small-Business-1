<!-- Quick Payment Out Modal -->
<dialog id="payment-out-modal">
    <article>
        <header><strong>📤 Payment Made (Reduces AP)</strong></header>
        <form method="POST" action="/payments/add-out">
            <label>Supplier
                <select name="party_id" required>
                    <option value="">Select supplier...</option>
                    {% for s in suppliers %}
                    <option value="{{ s.id }}">{{ s.name }}</option>
                    {% endfor %}
                </select>
            </label>
            <div class="grid">
                <label>Amount (৳) <input type="number" name="amount" step="0.01" min="0.01" required></label>
                <label>Date <input type="date" name="date_str"></label>
            </div>
            <label>Method
                <select name="method">
                    <option value="cash">Cash</option>
                    <option value="check">Check</option>
                </select>
            </label>
            <label>Notes <textarea name="notes" rows="2"></textarea></label>
            <footer>
                <button type="submit">Record</button>
                <button type="button" class="secondary" onclick="closeModal('payment-out-modal')">Cancel</button>
            </footer>
        </form>
    </article>
</dialog>
